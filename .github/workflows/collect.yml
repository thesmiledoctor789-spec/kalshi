name: Collect Kalshi tennis data
on:
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Cap on match markets (0 = everything; try 50 first)"
        default: "0"
  schedule:
    - cron: "17 9 * * *"   # daily top-up, 09:17 UTC
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          MAX_MARKETS: ${{ github.event.inputs.max_markets || '0' }}
          MAX_SECONDS: "19000"
        run: python collect.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update Kalshi tennis data"
          git push
